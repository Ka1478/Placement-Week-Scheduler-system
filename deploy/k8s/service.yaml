apiVersion: v1
kind: Service
metadata:
  name: placement-scheduler-backend-svc
  namespace: placement-scheduler
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
  selector:
    app: placement-scheduler-backend
---
apiVersion: v1
kind: Service
metadata:
  name: placement-scheduler-frontend-svc
  namespace: placement-scheduler
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: placement-scheduler-frontend
